<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Unix Epoch Timestamp Converter Tool</title>
    <meta name="description" content="Free online Unix timestamp converter tool. Convert epoch time to human-readable date and time instantly with 100% client-side privacy.">
    <meta name="keywords" content="unix timestamp converter, epoch converter, timestamp to date, developer tools, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 750px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #38bdf8; font-size: 14px; outline: none; font-family: monospace; }
        input:focus { border-color: #38bdf8; }
        
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-action { flex: 1; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        .btn-current { background: linear-gradient(135deg, #059669, #047857); }
        .btn-current:hover { background: linear-gradient(135deg, #047857, #065f46); }
        
        .result-box { margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .result-box h4 { color: #38bdf8; margin-bottom: 5px; font-size: 13px; }
        .result-text { color: #34d399; font-size: 16px; font-weight: bold; font-family: monospace; }

        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>⏱️ Global Unix Timestamp Converter</h2>
        <p>Convert Unix epoch timestamps to human-readable dates instantly in your browser</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA SENT TO SERVER</span>
        </div>

        <div class="form-group">
            <label>Enter Timestamp / یونیکس ٹائم اسٹیمپ درج کریں:</label>
            <input type="number" id="timestampInput" placeholder="e.g. 1718000000">
        </div>

        <div class="btn-row">
            <button class="btn-action" onclick="convertTimestamp()">🔄 Convert to Date</button>
            <button class="btn-action btn-current" onclick="setCurrentTimestamp()">⏰ Get Current Time</button>
        </div>

        <div class="result-box">
            <h4>Converted Human-Readable Date / تبدیل شدہ تاریخ:</h4>
            <div id="dateOutput" class="result-text">Result will appear here...</div>
        </div>
    </div>
</div>

<script>
    function setCurrentTimestamp() {
        const nowSec = Math.floor(Date.now() / 1000);
        document.getElementById('timestampInput').value = nowSec;
        convertTimestamp();
    }

    function convertTimestamp() {
        const val = document.getElementById('timestampInput').value.trim();
        const output = document.getElementById('dateOutput');

        if (!val) {
            output.innerText = "Please enter a valid timestamp!";
            return;
        }

        try {
            const timestamp = parseInt(val, 10);
            // JavaScript Date expects milliseconds, so multiply by 1000
            const date = new Date(timestamp * 1000);

            if (isNaN(date.getTime())) {
                output.innerText = "❌ Invalid Unix Timestamp!";
                return;
            }

            output.innerText = date.toUTCString() + " / " + date.toLocaleString();
        } catch (e) {
            output.innerText = "❌ Conversion Error: " + e.message;
        }
    }
</script>

</body>
</html>
