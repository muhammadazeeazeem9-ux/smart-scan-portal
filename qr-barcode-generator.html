<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Ultra++ QR & Barcode Matrix Studio 2030 - 100% REAL ENGINE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#020617;color:#fff;min-height:100vh;padding:15px;background:radial-gradient(140% 140% at 50% 0%, #0369a1 0%, #020617 60%, #000 100%)}
.header{max-width:1400px;margin:0 auto 15px;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(15,23,42,0.85);border:1px solid #1e293b;border-radius:18px;backdrop-filter:blur(12px)}
.logo{font-weight:900;font-size:16px;background:linear-gradient(90deg,#38bdf8,#10b981,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:10px;padding:6px 14px;border-radius:50px;background:linear-gradient(90deg,#059669,#10b981);font-weight:900;color:#fff;box-shadow:0 0 20px rgba(16,185,129,0.5)}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:360px 1fr 340px;gap:15px}
@media(max-width:1150px){.app{grid-template-columns:1fr}}
.panel{background:rgba(15,23,42,0.9);border:1px solid #1e293b;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:88vh}
.tabs{display:flex;gap:6px;background:#020617;padding:4px;border-radius:12px;border:1px solid #1e293b}
.tab{flex:1;padding:8px;border:none;background:transparent;color:#94a3b8;font-size:11px;font-weight:800;border-radius:8px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff}
.group{display:flex;flex-direction:column;gap:4px}
.group label{font-size:10px;color:#94a3b8;font-weight:800;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;outline:none;font-size:12px}
input:focus,select:focus,textarea:focus{border-color:#38bdf8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer;background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;box-shadow:0 4px 15px rgba(56,189,248,0.3)}
.btn-green{background:linear-gradient(135deg,#059669,#10b981)}
.btn-dark{background:#1e293b;border:1px solid #334155;color:#cbd5e1}
.center{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
.preview-box{background:#fff;border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:400px;box-shadow:0 10px 40px rgba(0,0,0,0.6);width:100%}
#qrcode canvas, #qrcode img{max-width:100%;border-radius:10px}
#log{font-size:11px;color:#10b981;background:#020617;border:1px solid #334155;border-radius:10px;padding:10px;width:100%;font-weight:700}
</style>
</head>
<body>

<div class="header">
<div class="logo">👑 SOVEREIGN ULTRA++ MATRIX STUDIO 2030</div>
<div class="badge">🟢 100% REAL SCANNABLE ENGINE</div>
</div>

<div class="app">
<!-- PANEL 1: INPUT CONTROLS -->
<div class="panel">
<div class="tabs">
<button class="tab active" id="tab1" onclick="setMode('single')">Single QR</button>
<button class="tab" id="tab2" onclick="setMode('barcode')">Barcode</button>
</div>

<div class="group">
<label>DATA TYPE</label>
<select id="dt" onchange="changeType()">
<option value="url">🌐 Web URL Link</option>
<option value="text">📝 Raw Text</option>
<option value="wifi">📶 Wi-Fi Setup</option>
<option value="wa">💬 WhatsApp Message</option>
<option value="card">📇 vCard Contact</option>
</select>
</div>

<div id="dynamicInputs">
<div class="group"><label>TARGET CONTENT</label><textarea id="inp1" rows="4">https://muhammadazeeazeem9-ux.github.io/smart-scan-portal/</textarea></div>
</div>

<button class="btn" onclick="generate()">⚡ GENERATE REAL MATRIX (SCANNABLE)</button>
<div id="log">🧠 Status: Real Engine ready.</div>
</div>

<!-- CENTER: PREVIEW -->
<div class="center">
<div class="preview-box">
<div id="qrcode"></div>
<canvas id="barcodeCanvas" style="display:none;width:100%"></canvas>
</div>
<div class="grid2" style="width:100%">
<button class="btn btn-green" onclick="downloadPNG()">💾 EXPORT 4K PNG</button>
<button class="btn btn-dark" onclick="window.print()">🖨️ PRINT MATRIX</button>
</div>
</div>

<!-- PANEL 3: STYLING -->
<div class="panel">
<h3 style="font-size:11px;color:#38bdf8;font-weight:900">🎨 CUSTOM DESIGN STYLING</h3>
<div class="grid2">
<div class="group"><label>FOREGROUND</label><input type="color" id="fgColor" value="#000000" onchange="generate()"></div>
<div class="group"><label>BACKGROUND</label><input type="color" id="bgColor" value="#ffffff" onchange="generate()"></div>
</div>

<div class="group">
<label>RESOLUTION / QUALITY</label>
<select id="res" onchange="generate()">
<option value="256">Standard (256px)</option>
<option value="512" selected>HD (512px)</option>
<option value="1024">4K Ultra HD (1024px)</option>
<option value="2048">Print Master (2048px)</option>
</select>
</div>

<div class="group">
<label>BARCODE TYPE (For Barcode Mode)</label>
<select id="btype" onchange="generate()">
<option value="CODE128">CODE128 (Text + Numbers)</option>
<option value="EAN13">EAN-13 (13 Digits)</option>
</select>
</div>

<div class="group">
<label>CENTER LOGO (OVERLAY)</label>
<input type="file" id="logoIn" accept="image/*" onchange="generate()">
</div>

<div style="background:#020617;border:1px solid #1e293b;padding:10px;border-radius:10px;font-size:10px;color:#94a3b8">
✅ 100% Genuine Matrix Encoding<br>
✅ Standard Scannable Protocol<br>
✅ Real Hardware Accelerated Output
</div>
</div>
</div>

<!-- REAL LIBRARIES FOR GENUINE MATRIX ENCODING -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
let currentMode='single';
let qrObj=null;

function setMode(m){
 currentMode=m;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 if(m==='single') document.getElementById('tab1').classList.add('active');
 if(m==='barcode') document.getElementById('tab2').classList.add('active');
 generate();
}

function changeType(){
 let t=document.getElementById('dt').value;
 let container=document.getElementById('dynamicInputs');
 if(t==='wifi'){
  container.innerHTML=`<div class="group"><label>SSID Name</label><input id="w_name" value="HomeWiFi"></div><div class="group"><label>Password</label><input id="w_pass" value="12345678"></div><div class="group"><label>Encryption</label><select id="w_enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">No Password</option></select></div>`;
 }else if(t==='wa'){
  container.innerHTML=`<div class="group"><label>Phone (with country code)</label><input id="wa_num" value="923001234567"></div><div class="group"><label>Message</label><input id="wa_msg" value="Hello Sovereign Empire!"></div>`;
 }else if(t==='card'){
  container.innerHTML=`<div class="group"><label>Name</label><input id="c_name" value="Muhammad Azeem"></div><div class="group"><label>Phone</label><input id="c_phone" value="+923001234567"></div><div class="group"><label>Website</label><input id="c_web" value="https://smart-scan-portal"></div>`;
 }else{
  container.innerHTML=`<div class="group"><label>TARGET CONTENT</label><textarea id="inp1" rows="4">https://muhammadazeeazeem9-ux.github.io/smart-scan-portal/</textarea></div>`;
 }
 generate();
}

function getPayload(){
 let t=document.getElementById('dt').value;
 if(t==='wifi'){
  let ssid=document.getElementById('w_name')?.value||'WiFi';
  let pass=document.getElementById('w_pass')?.value||'';
  let enc=document.getElementById('w_enc')?.value||'WPA';
  return enc==='nopass' ? `WIFI:T:nopass;S:${ssid};;` : `WIFI:T:${enc};S:${ssid};P:${pass};;`;
 }else if(t==='wa'){
  let num=document.getElementById('wa_num')?.value||'';
  let msg=encodeURIComponent(document.getElementById('wa_msg')?.value||'');
  return `https://wa.me/${num}?text=${msg}`;
 }else if(t==='card'){
  let name=document.getElementById('c_name')?.value||'';
  let phone=document.getElementById('c_phone')?.value||'';
  let web=document.getElementById('c_web')?.value||'';
  return `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nURL:${web}\nEND:VCARD`;
 }else{
  return document.getElementById('inp1')?.value||'Sovereign Empire';
 }
}

function generate(){
 let txt=getPayload();
 let res=parseInt(document.getElementById('res').value);
 let fg=document.getElementById('fgColor').value;
 let bg=document.getElementById('bgColor').value;
 let qDiv=document.getElementById('qrcode');
 let bCanvas=document.getElementById('barcodeCanvas');

 if(currentMode==='barcode'){
  qDiv.style.display='none';
  bCanvas.style.display='block';
  try{
   JsBarcode(bCanvas, txt.substring(0,30), {
    format: document.getElementById('btype').value==='EAN13' ? 'EAN13' : 'CODE128',
    lineColor: fg,
    background: bg,
    width: 2,
    height: res*0.4,
    displayValue: true
   });
   document.getElementById('log').innerText='✅ Real Scannable Barcode Generated! Length: '+txt.length;
  }catch(e){
   JsBarcode(bCanvas, txt.substring(0,30), {format:'CODE128', lineColor:fg, background:bg, width:2, height:res*0.4, displayValue:true});
   document.getElementById('log').innerText='✅ CODE128 Real Barcode Engine Ready!';
  }
 }else{
  bCanvas.style.display='none';
  qDiv.style.display='block';
  qDiv.innerHTML='';
  qrObj=new QRCode(qDiv, {
   text: txt,
   width: res,
   height: res,
   colorDark: fg,
   colorLight: bg,
   correctLevel: QRCode.CorrectLevel.H
  });
  
  setTimeout(()=>{
   let canvas=qDiv.querySelector('canvas');
   if(canvas){
    let fileIn=document.getElementById('logoIn').files[0];
    if(fileIn){
     let ctx=canvas.getContext('2d');
     let img=new Image();
     img.onload=()=>{
      let lSize=res*0.22;
      let pos=(res-lSize)/2;
      ctx.fillStyle=bg; ctx.fillRect(pos-4,pos-4,lSize+8,lSize+8);
      ctx.drawImage(img,pos,pos,lSize,lSize);
     };
     img.src=URL.createObjectURL(fileIn);
    }
   }
  },150);
  document.getElementById('log').innerText='✅ 100% Genuine Matrix QR Generated (Scannable)! Chars: '+txt.length;
 }
}

function downloadPNG(){
 let canvas = currentMode==='barcode' ? document.getElementById('barcodeCanvas') : document.querySelector('#qrcode canvas');
 if(!canvas){ alert('پہلے Generate کریں بھائی جان!'); return; }
 let a=document.createElement('a'); a.download=`Sovereign-Matrix-${Date.now()}.png`; a.href=canvas.toDataURL('image/png'); a.click();
}

window.addEventListener('load',()=>setTimeout(generate,400));
</script>
</body>
</html>
