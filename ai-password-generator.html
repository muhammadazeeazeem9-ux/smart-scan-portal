<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniShield Enterprise Password Vault Pro</title>
    <meta name="description" content="Military-grade offline password & passphrase generator with local encrypted vault history.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: radial-gradient(circle at center, #0f172a 0%, #0b0f19 100%); color: #f8fafc; padding: 25px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(24px); border-radius: 24px; padding: 36px; border: 1px solid rgba(51, 65, 85, 0.9); width: 100%; max-width: 800px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9); }
        .card h2 { color: #38bdf8; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
        .card p { color: #94a3b8; font-size: 14px; text-align: center; margin: 8px 0 20px; }
        
        .badge { background: linear-gradient(90deg, #065f46, #047857); color: #34d399; font-size: 11px; padding: 8px 18px; border-radius: 50px; border: 1px solid #059669; display: block; text-align: center; font-weight: 700; margin: 0 auto 26px; width: max-content; text-transform: uppercase; box-shadow: 0 4px 12px rgba(4, 120, 87, 0.3); }
        
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; padding: 6px; border-radius: 14px; border: 1px solid #334155; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border: none; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #1e293b; color: #38bdf8; border: 1px solid #475569; }

        .display-box { background: #0f172a; border: 2px solid #334155; border-radius: 16px; padding: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .display-box input { background: transparent; border: none; color: #f8fafc; font-size: 20px; font-weight: 700; width: 100%; outline: none; letter-spacing: 1px; font-family: monospace; }
        .icon-btn { background: #1e293b; border: 1px solid #475569; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .icon-btn:hover { background: #334155; border-color: #38bdf8; }

        .strength-container { background: #0f172a; border: 1px solid #334155; border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; }
        .strength-bar { height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .strength-fill { height: 100%; width: 0%; transition: all 0.4s ease; border-radius: 10px; }
        .strength-info { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: 700; }

        .controls { background: #0f172a; border: 1px solid #334155; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
        .group label { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; }
        .group input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
        
        .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media(max-width: 600px) { .checks { grid-template-columns: 1fr; } }
        .check { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #cbd5e1; background: #1e293b; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        .check:hover { border-color: #475569; }
        .check input { accent-color: #38bdf8; width: 16px; height: 16px; cursor: pointer; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; background: linear-gradient(135deg, #0284c7, #6366f1); color: white; box-shadow: 0 6px 20px rgba(99,102,241,0.4); transition: 0.2s; }
        .btn:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }

        .history-box { margin-top: 20px; background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 16px; max-height: 140px; overflow-y: auto; }
        .history-title { font-size: 12px; color: #38bdf8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .history-item { font-size: 12px; font-family: monospace; color: #94a3b8; padding: 6px 10px; background: #1e293b; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

        .trust-note { font-size: 11px; color: #64748b; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 OmniShield Enterprise Password Vault</h2>
    <p>Next-Gen Cryptographic Security Suite — 100% Offline & Private</p>
    <span class="badge">🔒 Military-Grade Entropy • Zero Cloud Logging</span>

    <div class="mode-tabs">
        <button class="tab active" id="tabPass" onclick="switchMode('password')">⚡ Random Password</button>
        <button class="tab" id="tabPhrase" onclick="switchMode('passphrase')">🛡️ Secure Passphrase</button>
    </div>

    <div class="display-box">
        <input type="text" id="passOutput" readonly placeholder="Click Generate...">
        <button class="icon-btn" onclick="copyPass()" title="Copy Password">📋</button>
        <button class="icon-btn" onclick="generate()" title="Generate New">🔄</button>
    </div>

    <div class="strength-container">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-info">
            <span id="strengthLabel">Security Rating: -</span>
            <span id="crackTime" style="color:#38bdf8">Crack Time: -</span>
        </div>
    </div>

    <div class="controls">
        <div class="group" id="lengthGroup">
            <label>Character Length <span id="lenVal" style="color:#38bdf8">18</span></label>
            <input type="range" id="passLength" min="8" max="64" value="18" oninput="document.getElementById('lenVal').innerText=this.value; generate()">
        </div>

        <div class="group" id="wordsGroup" style="display: none;">
            <label>Word Count <span id="wordVal" style="color:#38bdf8">5</span></label>
            <input type="range" id="wordCount" min="3" max="10" value="5" oninput="document.getElementById('wordVal').innerText=this.value; generate()">
        </div>

        <div class="checks" id="optionsGroup">
            <label class="check"><input type="checkbox" id="incUpper" checked onchange="generate()"> Uppercase Letters (A-Z)</label>
            <label class="check"><input type="checkbox" id="incLower" checked onchange="generate()"> Lowercase Letters (a-z)</label>
            <label class="check"><input type="checkbox" id="incNum" checked onchange="generate()"> Numeric Digits (0-9)</label>
            <label class="check"><input type="checkbox" id="incSym" checked onchange="generate()"> Special Symbols (@#$)</label>
        </div>

        <button class="btn" onclick="generate()">⚡ GENERATE SECURE CREDENTIAL</button>
    </div>

    <div class="history-box" id="historyBox" style="display:none;">
        <div class="history-title">Recent Session Vault History</div>
        <div id="historyList"></div>
    </div>

    <p class="trust-note">Uses cryptographic window.crypto API. Data never leaves your hardware device.</p>
</div>

<script>
    let currentMode = 'password';
    let history = [];

    const chars = {
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz',
        num: '0123456789',
        sym: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    const wordList = ['apex', 'crypto', 'shield', 'vault', 'quantum', 'nexus', 'matrix', 'secure', 'orbit', 'cyber', 'fusion', 'shield', 'vector', 'zenith', 'pulse', 'alpha', 'delta', 'sigma', 'titan', 'beacon', 'storm', 'frost', 'blaze', 'core', 'signal'];

    function switchMode(mode) {
        currentMode = mode;
        if(mode === 'password') {
            document.getElementById('tabPass').classList.add('active');
            document.getElementById('tabPhrase').classList.remove('active');
            document.getElementById('lengthGroup').style.display = 'block';
            document.getElementById('wordsGroup').style.display = 'none';
            document.getElementById('optionsGroup').style.display = 'grid';
        } else {
            document.getElementById('tabPhrase').classList.add('active');
            document.getElementById('tabPass').classList.remove('active');
            document.getElementById('lengthGroup').style.display = 'none';
            document.getElementById('wordsGroup').style.display = 'block';
            document.getElementById('optionsGroup').style.display = 'none';
        }
        generate();
    }

    function secureRandom(max) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] % max;
    }

    function generate() {
        let result = '';
        if(currentMode === 'password') {
            let length = parseInt(document.getElementById('passLength').value);
            let pool = '';
            if(document.getElementById('incUpper').checked) pool += chars.upper;
            if(document.getElementById('incLower').checked) pool += chars.lower;
            if(document.getElementById('incNum').checked) pool += chars.num;
            if(document.getElementById('incSym').checked) pool += chars.sym;
            
            if(!pool) {
                alert('براہ کرم کم از کم ایک کریکٹر سیٹ منتخب کریں!');
                return;
            }

            for(let i=0; i<length; i++) {
                result += pool[secureRandom(pool.length)];
            }
            updateStrength(result, pool.length);
        } else {
            let count = parseInt(document.getElementById('wordCount').value);
            let words = [];
            for(let i=0; i<count; i++) {
                words.push(wordList[secureRandom(wordList.length)]);
            }
            // Capitalize and join with secure symbols
            let symbols = ['-', '_', '.', '#'];
            result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(symbols[secureRandom(symbols.length)]);
            updateStrength(result, wordList.length * count);
        }

        document.getElementById('passOutput').value = result;
        addToHistory(result);
    }

    function updateStrength(pass, complexityFactor) {
        let entropy = pass.length * Math.log2(Math.max(complexityFactor, 10));
        let fill = document.getElementById('strengthFill');
        let label = document.getElementById('strengthLabel');
        let crack = document.getElementById('crackTime');

        if(entropy < 45) {
            fill.style.width = '30%'; fill.style.background = '#ef4444';
            label.innerText = 'Rating: Vulnerable'; crack.innerText = 'Crack Time: Minutes';
        } else if(entropy < 70) {
            fill.style.width = '60%'; fill.style.background = '#f59e0b';
            label.innerText = 'Rating: Moderate Standard'; crack.innerText = 'Crack Time: Years';
        } else if(entropy < 100) {
            fill.style.width = '85%'; fill.style.background = '#38bdf8';
            label.innerText = 'Rating: High Military Grade'; crack.innerText = 'Crack Time: Centuries';
        } else {
            fill.style.width = '100%'; fill.style.background = '#22c55e';
            label.innerText = 'Rating: Quantum Proof / Unbreakable'; crack.innerText = 'Crack Time: Millennia';
        }
    }

    function addToHistory(pass) {
        if(!history.includes(pass)) {
            history.unshift(pass);
            if(history.length > 5) history.pop();
            
            let box = document.getElementById('historyBox');
            let list = document.getElementById('historyList');
            box.style.display = 'block';
            list.innerHTML = history.map(h => `<div class="history-item"><span>${h}</span><span style="color:#34d399">Saved</span></div>`).join('');
        }
    }

    function copyPass() {
        let input = document.getElementById('passOutput');
        if(!input.value) return;
        navigator.clipboard.writeText(input.value);
        alert('Credential Copied to Clipboard! ✅');
    }

    window.onload = generate;
</script>

</body>
</html>
