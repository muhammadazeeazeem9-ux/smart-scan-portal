<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Advanced Text, Word & Data Analyzer Tool</title>
    <meta name="description" content="Free online text analyzer, word counter, character count, and reading time estimator tool. 100% client-side privacy for global users.">
    <meta name="keywords" content="word counter, text analyzer, character count tool, reading time calculator, free online tools, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        textarea { width: 100%; height: 150px; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; resize: vertical; }
        textarea:focus { border-color: #38bdf8; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .stat-box h4 { color: #94a3b8; font-size: 12px; margin-bottom: 5px; }
        .stat-value { color: #38bdf8; font-size: 18px; font-weight: bold; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 15px; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>🌐 Global Advanced Text & Word Analyzer</h2>
        <p>Instant word count, character count, and text metrics for global creators</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA STORED ON SERVER</span>
        </div>

        <div class="form-group">
            <label>Paste your text below / یہاں اپنا ٹیکسٹ درج کریں:</label>
            <textarea id="textInput" placeholder="Type or paste your content here..." oninput="analyzeText()"></textarea>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h4>WORDS</h4>
                <div id="wordCount" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <h4>CHARACTERS</h4>
                <div id="charCount" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <h4>READING TIME</h4>
                <div id="readTime" class="stat-value">0 sec</div>
            </div>
            <div class="stat-box">
                <h4>SENTENCES</h4>
                <div id="sentCount" class="stat-value">0</div>
            </div>
        </div>

        <button class="btn-action" onclick="clearText()">Clear Text</button>
    </div>
</div>

<script>
    function analyzeText() {
        const text = document.getElementById('textInput').value.trim();
        
        // Characters count
        const charCount = text.length;
        
        // Words count
        const words = text === "" ? [] : text.split(/\s+/);
        const wordCount = words.length;

        // Sentences count
        const sentences = text === "" ? [] : text.split(/[.!?]+/).filter(Boolean);
        const sentCount = sentences.length;

        // Reading time (approx 200 words per minute)
        const readTimeSec = Math.ceil((wordCount / 200) * 60);

        document.getElementById('wordCount').innerText = wordCount;
        document.getElementById('charCount').innerText = charCount;
        document.getElementById('sentCount').innerText = sentCount;
        document.getElementById('readTime').innerText = readTimeSec < 60 ? `${readTimeSec} sec` : `${(readTimeSec/60).toFixed(1)} min`;
    }

    function clearText() {
        document.getElementById('textInput').value = "";
        analyzeText();
    }
</script>

</body>
</html>
