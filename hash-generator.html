<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Instant Text Hash & SHA-256 Generator Tool</title>
    <meta name="description" content="Free online text hash generator tool. Generate instant SHA-256, SHA-1, and SHA-512 hashes securely with 100% client-side browser privacy.">
    <meta name="keywords" content="hash generator, sha256 generator, sha1 generator, sha512 online, crypto hash tool, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 650px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 14px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        textarea, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        textarea { height: 100px; resize: vertical; }
        textarea:focus, select:focus { border-color: #38bdf8; }
        
        .result-box { margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: left; word-break: break-all; }
        .result-box h4 { color: #38bdf8; margin-bottom: 5px; font-size: 13px; }
        .result-text { color: #34d399; font-size: 14px; font-family: monospace; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>🔑 Global Secure Text Hash Generator</h2>
        <p>Generate cryptographic hashes (SHA-256, SHA-1, SHA-512) instantly in your browser</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA SENT TO ANY SERVER</span>
        </div>

        <div class="form-group">
            <label>Select Hash Algorithm / ہیش کی قسم چنیں:</label>
            <select id="algoSelect" onchange="generateHash()">
                <option value="SHA-256">SHA-256 (Highly Secure - Recommended)</option>
                <option value="SHA-512">SHA-512 (Ultra High Security)</option>
                <option value="SHA-1">SHA-1 (Legacy Standard)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Enter Text to Hash / ٹیکسٹ درج کریں:</label>
            <textarea id="hashInput" placeholder="Type or paste any text or string here..." oninput="generateHash()"></textarea>
        </div>

        <button class="btn-action" onclick="generateHash()">⚙️ Generate Cryptographic Hash</button>

        <div class="result-box">
            <h4>Generated Output Hash / جنریٹ شدہ ہیش:</h4>
            <div id="hashOutput" class="result-text">Hash output will appear here...</div>
        </div>
    </div>
</div>

<script>
    async function generateHash() {
        const text = document.getElementById('hashInput').value;
        const algo = document.getElementById('algoSelect').value;
        const output = document.getElementById('hashOutput');

        if (!text) {
            output.innerText = "Hash output will appear here...";
            return;
        }

        try {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest(algo, data);
            
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            output.innerText = hashHex;
        } catch (e) {
            output.innerText = "Error generating hash. Please check browser support.";
        }
    }
</script>

</body>
</html>
