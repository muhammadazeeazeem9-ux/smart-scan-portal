<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScan - Field Agent & Campaign Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
        
        .stats-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .stats-box h4 { color: #38bdf8; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card" style="max-width: 600px; width: 100%;">
        <h2>🛡️ فیلڈ ایجنٹ مہم ڈیش بورڈ</h2>
        <p>تنظیمی کارکنان اور فیلڈ ورکرز کے لیے سکیور لوکل مہم مینیجر</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">UNOFFICIAL - FOR PARTY / ORGANIZATIONAL USE ONLY - NOT ECP ISSUED</span>
        </div>

        <div class="form-group">
            <label>ایجنٹ کا نام (Agent Name):</label>
            <input type="text" id="agentName" placeholder="مثال: علی خان">
        </div>

        <div class="form-group">
            <label>حلقہ یا علاقہ (Assigned Area / Constituency):</label>
            <input type="text" id="agentArea" placeholder="مثال: یونین کونسل 4 - بلاک بی">
        </div>

        <div class="form-group">
            <label>آج کے وزٹس / رابطے (Today's Contacts Count):</label>
            <input type="number" id="contactCount" placeholder="مثال: 45">
        </div>

        <button class="btn-action" onclick="saveAgentReport()">📊 رپورٹ لوکل محفوظ کریں</button>

        <div class="stats-box">
            <h4>کل ریکارڈز (Local Storage):</h4>
            <p id="reportStatus" style="color: #94a3b8; font-size: 13px;">کوئی ڈیٹا محفوظ نہیں کیا گیا۔</p>
        </div>
    </div>
</div>

<script>
    function saveAgentReport() {
        const name = document.getElementById('agentName').value.trim();
        const area = document.getElementById('agentArea').value.trim();
        const count = document.getElementById('contactCount').value.trim();

        if (!name || !area || !count) {
            alert('براہ کرم تمام خانے پر کریں!');
            return;
        }

        const reportData = `ایجنٹ: ${name} | علاقہ: ${area} | رابطے: ${count} | وقت: ${new Date().toLocaleDateString()}`;
        localStorage.setItem('lastAgentReport', reportData);

        document.getElementById('reportStatus').innerHTML = `آخری رپورٹ محفوظ ہو گئی: <br><b>${reportData}</b>`;
        alert('رپورٹ لوکل ڈیوائس پر محفوظ ہو گئی!');
    }

    window.onload = function() {
        const saved = localStorage.getItem('lastAgentReport');
        if (saved) {
            document.getElementById('reportStatus').innerHTML = `آخری رپورٹ محفوظ ہو گئی: <br><b>${saved}</b>`;
        }
    };
</script>

</body>
</html>
