<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Global Enterprise Base64 Studio 2030</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#020617;color:#f8fafc;min-height:100vh;padding:20px;background:radial-gradient(150% 150% at 50% 0%, #0f172a 0%, #020617 70%, #000 100%)}
.header{max-width:1600px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:rgba(15,23,42,0.9);border:1px solid #1e293b;border-radius:20px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo{font-weight:900;background:linear-gradient(90deg,#38bdf8,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:18px}
.badge{font-size:11px;padding:6px 16px;border-radius:50px;background:linear-gradient(90deg,#059669,#10b981);font-weight:900;color:#fff;box-shadow:0 0 20px rgba(16,185,129,0.4)}
.workspace{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}}
.card{background:rgba(15,23,42,0.85);border:1px solid #1e293b;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.card h3{font-size:14px;color:#38bdf8;font-weight:800;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;padding:16px;border-radius:14px;border:1px solid #334155;background:#020617;color:#34d399;outline:none;font-size:13px;min-height:220px;resize:vertical;font-family:'Courier New',monospace;line-height:1.6}
textarea:focus{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,0.2)}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.btn{padding:12px;border:none;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer;background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;box-shadow:0 4px 15px rgba(56,189,248,0.25);transition:0.2s}
.btn:hover{opacity:0.92;transform:translateY(-2px)}
.btn-sec{background:#1e293b;border:1px solid #334155;color:#cbd5e1}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 15px rgba(16,185,129,0.3)}
.drop-zone{border:2px dashed #334155;border-radius:14px;padding:18px;text-align:center;color:#94a3b8;font-size:12px;cursor:pointer;background:rgba(2,6,23,0.5);transition:0.2s}
.drop-zone:hover{border-color:#38bdf8;color:#38bdf8}
.stats{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;background:#020617;padding:10px 14px;border-radius:10px;border:1px solid #1e293b;font-family:monospace}
.valid{color:#34d399;font-weight:700}
.invalid{color:#f87171;font-weight:700}
img.preview{max-width:100%;max-height:140px;border-radius:10px;border:1px solid #1e293b;margin-top:8px;object-fit:contain}
</style>
</head>
<body>

<div class="header">
<div class="logo">👑 SOVEREIGN GLOBAL ENTERPRISE BASE64 STUDIO 2030</div>
<div class="badge">🟢 155+ NATIONS COMPLIANT</div>
</div>

<div class="workspace">
<!-- INPUT PANEL -->
<div class="card">
<h3><span>📥 ENTERPRISE INPUT STREAM</span><span id="inStat" class="valid">Ready</span></h3>
<textarea id="inp" placeholder="Paste text, payload, or drop file below...">Sovereign Empire - International Grade Studio 2030</textarea>

<div class="drop-zone" onclick="document.getElementById('fileIn').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
📁 Drop Any File, Image or Document Here (Multi-Format Support)
<input type="file" id="fileIn" style="display:none" onchange="handleFile(this.files[0])">
</div>

<div class="btn-grid">
<button class="btn" onclick="processBase64('encode')">🔒 ENCODE</button>
<button class="btn btn-sec" onclick="processBase64('decode')">🔓 DECODE</button>
<button class="btn btn-sec" onclick="processDataURI()">🌐 DATA URI</button>
<button class="btn btn-sec" onclick="clearAll()">🗑️ CLEAR</button>
</div>

<div class="stats"><span id="charCount">Chars: 0</span><span id="byteCount">0 Bytes</span></div>
<img id="inPreview" class="preview" style="display:none">
</div>

<!-- OUTPUT PANEL -->
<div class="card">
<h3><span>📤 INTERNATIONAL OUTPUT STREAM</span><span id="outStat" class="valid">Idle</span></h3>
<textarea id="out" readonly placeholder="Processed base64 output stream..."></textarea>

<div class="btn-grid">
<button class="btn btn-success" onclick="copyOut()">📋 COPY OUTPUT</button>
<button class="btn btn-sec" onclick="downloadOut()">💾 EXPORT FILE</button>
<button class="btn btn-sec" onclick="swapStreams()">🔄 SWAP IO</button>
</div>

<div class="stats"><span id="outCharCount">Chars: 0</span><span id="outByteCount">0 Bytes</span></div>
<img id="outPreview" class="preview" style="display:none">
</div>
</div>

<script>
function updateStats(text, isInput = true){
 let bytes = new TextEncoder().encode(text).length;
 if(isInput){
  document.getElementById('charCount').innerText = `Chars: ${text.length}`;
  document.getElementById('byteCount').innerText = `${bytes} Bytes`;
 } else {
  document.getElementById('outCharCount').innerText = `Chars: ${text.length}`;
  // FIXED: Pointing directly to valid 'outByteCount' ID
  document.getElementById('outByteCount').innerText = `${bytes} Bytes`;
 }
}

function processBase64(action){
 let val = document.getElementById('inp').value;
 updateStats(val, true);
 if(!val.trim()){
  document.getElementById('out').value = '';
  document.getElementById('outByteCount').innerText = '0 Bytes';
  document.getElementById('inStat').innerText = 'Empty';
  document.getElementById('outStat').innerText = 'Idle';
  return;
 }
 try {
  let res = '';
  if(action === 'encode'){
   res = btoa(unescape(encodeURIComponent(val)));
   document.getElementById('inStat').className = 'valid';
   document.getElementById('inStat').innerText = 'Encoded Successfully ✅';
   document.getElementById('outStat').innerText = 'Base64 Stream Ready';
  } else if(action === 'decode'){
   res = decodeURIComponent(escape(atob(val.trim())));
   document.getElementById('inStat').className = 'valid';
   document.getElementById('inStat').innerText = 'Decoded Successfully ✅';
   document.getElementById('outStat').innerText = 'Plain Text Restored';
  }
  document.getElementById('out').value = res;
  updateStats(res, false);
 } catch(e) {
  document.getElementById('out').value = `[INTERNATIONAL CODEC ERROR]:\n${e.message}\nMake sure input is valid formatting!`;
  document.getElementById('inStat').className = 'invalid';
  document.getElementById('inStat').innerText = 'Error ❌';
  document.getElementById('outStat').className = 'invalid';
  document.getElementById('outStat').innerText = 'Failed';
 }
}

function processDataURI(){
 let val = document.getElementById('inp').value.trim();
 if(!val) return;
 let dataUri = `data:text/plain;base64,` + btoa(unescape(encodeURIComponent(val)));
 document.getElementById('out').value = dataUri;
 updateStats(dataUri, false);
 document.getElementById('outStat').innerText = 'Data URI Generated';
}

function handleFile(file){
 if(!file) return;
 let reader = new FileReader();
 reader.onload = function(e){
  let result = e.target.result;
  document.getElementById('out').value = result;
  document.getElementById('inp').value = `[Loaded File: ${file.name} | Size: ${file.size} Bytes]`;
  updateStats(result, false);
  document.getElementById('inStat').className = 'valid';
  document.getElementById('inStat').innerText = `File Loaded (${file.type || 'Binary'})`;
  document.getElementById('outStat').innerText = 'Data URI Stream Ready';
  
  if(file.type.startsWith('image/')){
   document.getElementById('outPreview').src = result;
   document.getElementById('outPreview').style.display = 'block';
  } else {
   document.getElementById('outPreview').style.display = 'none';
  }
 };
 reader.readAsDataURL(file);
}

function handleDrop(e){
 e.preventDefault();
 let file = e.dataTransfer.files[0];
 if(file) handleFile(file);
}

function copyOut(){
 let out = document.getElementById('out');
 if(!out.value) return;
 out.select();
 navigator.clipboard.writeText(out.value);
 document.getElementById('outStat').innerText = 'Copied to Global Clipboard! 📋';
}

function downloadOut(){
 let content = document.getElementById('out').value;
 if(!content) return;
 let blob = new Blob([content], {type: 'text/plain'});
 let url = URL.createObjectURL(blob);
 let a = document.createElement('a');
 a.href = url;
 a.download = `Sovereign-Base64-${Date.now()}.txt`;
 a.click();
 URL.revokeObjectURL(url);
}

function swapStreams(){
 let inp = document.getElementById('inp');
 let out = document.getElementById('out');
 let temp = inp.value;
 inp.value = out.value;
 out.value = temp;
 updateStats(inp.value, true);
 updateStats(out.value, false);
}

function clearAll(){
 document.getElementById('inp').value = '';
 document.getElementById('out').value = '';
 document.getElementById('inPreview').style.display = 'none';
 document.getElementById('outPreview').style.display = 'none';
 updateStats('', true);
 document.getElementById('outByteCount').innerText = '0 Bytes';
 document.getElementById('inStat').innerText = 'Cleared';
 document.getElementById('outStat').innerText = 'Idle';
}

document.getElementById('inp').addEventListener('input', () => {
 clearTimeout(window._t);
 window._t = setTimeout(() => processBase64('encode'), 300);
});

window.addEventListener('load',()=>setTimeout(() => processBase64('encode'), 200));
</script>
</body>
</html>
