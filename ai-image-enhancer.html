<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniShield AI Image Enhancer - Ultra Edition</title>
    <meta name="description" content="Free AI Image Enhancer - Enhance, Sharpen & Upscale to 2x HD 100% Private in Browser. No upload to server.">
    <script type="application/ld+json">
    {"@type":"SoftwareApplication","name":"OmniShield AI Image Enhancer","applicationCategory":"MultimediaApplication","offers":{"@type":"Offer","price":"0"}}
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card { background: #1e293b; border-radius: 20px; padding: 30px; border: 1px solid #334155; width: 100%; max-width: 1000px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
        .card h2 { color: #38bdf8; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .card p { color: #94a3b8; font-size: 14px; text-align: center; margin: 8px 0 16px; }
        
        .badge { background: linear-gradient(90deg, #065f46, #047857); color: #34d399; font-size: 11px; padding: 8px 16px; border-radius: 50px; border: 1px solid #059669; display: block; text-align: center; font-weight: 700; margin: 0 auto 22px; width: max-content; letter-spacing: 0.5px; }
        
        .upload { border: 2px dashed #475569; padding: 40px 20px; border-radius: 16px; text-align: center; background: #0f172a; cursor: pointer; transition: all 0.3s ease; }
        .upload:hover, .upload.dragover { border-color: #38bdf8; background: #172033; transform: translateY(-2px); }
        .upload input { display: none; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; display: block; }

        .workspace { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 24px; }
        @media(max-width: 820px) { .workspace { grid-template-columns: 1fr; } }
        
        .sidebar { background: #0f172a; padding: 20px; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 16px; }
        .group label { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
        .group input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
        
        .btn { width: 100%; padding: 12px 16px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.98); }
        .btn-ai { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); }
        .btn-ai:hover { opacity: 0.95; }
        .btn-down { background: #059669; color: #fff; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4); }
        .btn-down:hover { background: #047857; }
        .btn-sec { background: #334155; color: #fff; }
        .btn-sec:hover { background: #475569; }
        .btn-compare { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; margin-top: 6px; }
        .btn-compare:hover { background: #334155; color: #fff; }

        .canvas-area { background: #0f172a; border: 1px solid #334155; border-radius: 16px; display: flex; justify-content: center; align-items: center; min-height: 420px; position: relative; overflow: hidden; padding: 16px; flex-direction: column; }
        canvas { max-width: 100%; max-height: 480px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); object-fit: contain; }
        .info { font-size: 12px; color: #94a3b8; margin-top: 12px; font-weight: 500; }
        .status { font-size: 12px; text-align: center; color: #38bdf8; min-height: 18px; font-weight: 600; }

        .loader { border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>✨ OmniShield AI Image Enhancer V4.2</h2>
    <p>Client-Side Matrix Sharpening & 2x Super HD Resolution</p>
    <span class="badge">🔒 100% PRIVATE — NO SERVER UPLOADS — ZERO DATA LEAK</span>

    <div class="upload" id="dropZone" onclick="document.getElementById('fileIn').click()">
        <input type="file" id="fileIn" accept="image/*">
        <span class="upload-icon">🖼️</span>
        <div style="color:#38bdf8;font-weight:700;font-size:16px">Drag & Drop or Click to Select Image</div>
        <div style="font-size:12px;color:#64748b;margin-top:6px">PNG, JPG, WEBP | 100% Local Browser Engine</div>
    </div>

    <div class="workspace" id="ws" style="display:none">
        <div class="sidebar">
            <button class="btn btn-ai" onclick="autoFix()">🤖 Smart AI Auto-Fix</button>
            
            <div class="group"><label>Brightness <span id="bV">105</span>%</label><input type="range" id="b" min="50" max="150" value="105" oninput="render()"></div>
            <div class="group"><label>Contrast <span id="cV">112</span>%</label><input type="range" id="c" min="50" max="150" value="112" oninput="render()"></div>
            <div class="group"><label>Saturation <span id="sV">115</span>%</label><input type="range" id="s" min="0" max="200" value="115" oninput="render()"></div>
            <div class="group"><label>AI Sharpness <span id="shV">35</span>%</label><input type="range" id="sh" min="0" max="100" value="35" onchange="render()" oninput="updateLabel('shV', this.value)"></div>
            
            <div class="group" style="background:#172033;padding:12px;border-radius:10px;border:1px solid #334155">
                <label style="cursor:pointer;display:flex;align-items:center;gap:10px;margin:0;color:#f8fafc;font-size:13px">
                    <input type="checkbox" id="up2" checked onchange="render()" style="accent-color:#38bdf8;width:16px;height:16px"> 
                    <span>2x Super HD Upscale</span>
                </label>
            </div>

            <button class="btn btn-compare" id="compareBtn" onmousedown="showOriginal()" onmouseup="hideOriginal()" onmouseleave="hideOriginal()" ontouchstart="showOriginal()" ontouchend="hideOriginal()">👁️ Hold to View Original</button>
            <button class="btn btn-sec" onclick="resetAll()">🔄 Reset Adjustments</button>
            <div class="status" id="st">Ready</div>
        </div>

        <div class="canvas-area">
            <canvas id="cv"></canvas>
            <div class="info" id="info"></div>
        </div>
    </div>

    <div id="dlWrap" style="display:none;margin-top:20px">
        <a id="dl" class="btn btn-down" download="omnishield-enhanced-hd.png" style="font-size:15px;padding:14px">💾 Download Enhanced HD Image</a>
    </div>
</div>

<script>
let rawImg = new Image(), cv = document.getElementById('cv'), ctx = cv.getContext('2d'), loaded = false;
let dz = document.getElementById('dropZone');

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => { 
    e.preventDefault(); 
    dz.classList.remove('dragover'); 
    if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
});
document.getElementById('fileIn').addEventListener('change', e => handle(e.target.files[0]));

function updateLabel(id, val) {
    document.getElementById(id).innerText = val;
}

function handle(file) {
    if(!file || !file.type.startsWith('image/')) return alert('مہرپانی کر کے صحیح امیج فائل منتخب کریں!');
    const r = new FileReader();
    r.onload = e => {
        rawImg = new Image();
        rawImg.src = e.target.result;
        rawImg.onload = () => {
            document.getElementById('ws').style.display = 'grid';
            document.getElementById('dlWrap').style.display = 'block';
            loaded = true; 
            autoFix();
            document.getElementById('info').innerText = `Dimensions: ${rawImg.width}x${rawImg.height}px | Original Size: ${(file.size/1024/1024).toFixed(2)} MB`;
        };
    };
    r.readAsDataURL(file);
}

function render() {
    if(!loaded) return;
    
    const b = document.getElementById('b').value;
    const c = document.getElementById('c').value;
    const s = document.getElementById('s').value;
    const sh = document.getElementById('sh').value;
    const up = document.getElementById('up2').checked;

    updateLabel('bV', b); 
    updateLabel('cV', c); 
    updateLabel('sV', s); 
    updateLabel('shV', sh);

    document.getElementById('st').innerHTML = `<span class="loader"></span> Enhancing pixels...`;

    setTimeout(() => {
        let W = rawImg.width, H = rawImg.height; 
        if(up) { W *= 2; H *= 2; }
        
        cv.width = W; 
        cv.height = H;
        
        ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
        ctx.drawImage(rawImg, 0, 0, W, H);
        ctx.filter = 'none';

        if(sh > 0) {
            sharpen(sh / 100);
        }

        document.getElementById('dl').href = cv.toDataURL('image/png');
        document.getElementById('st').innerText = up ? `Rendered 2x HD (${W}x${H}px)` : `Rendered (${W}x${H}px)`;
    }, 20);
}

function sharpen(amount) {
    const w = cv.width, h = cv.height;
    let imgData = ctx.getImageData(0, 0, w, h);
    let data = imgData.data;
    let copy = new Uint8ClampedArray(data);
    let kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
    
    for(let y = 1; y < h - 1; y++) {
        for(let x = 1; x < w - 1; x++) {
            let idx = (y * w + x) * 4;
            let r = 0, g = 0, b2 = 0;
            let k = 0;
            for(let ky = -1; ky <= 1; ky++) {
                for(let kx = -1; kx <= 1; kx++) {
                    let nIdx = ((y + ky) * w + (x + kx)) * 4;
                    r += copy[nIdx] * kernel[k];
                    g += copy[nIdx + 1] * kernel[k];
                    b2 += copy[nIdx + 2] * kernel[k];
                    k++;
                }
            }
            data[idx] = copy[idx] * (1 - amount) + r * amount;
            data[idx + 1] = copy[idx + 1] * (1 - amount) + g * amount;
            data[idx + 2] = copy[idx + 2] * (1 - amount) + b2 * amount;
        }
    }
    ctx.putImageData(imgData, 0, 0);
}

function showOriginal() {
    if(!loaded) return;
    cv.width = rawImg.width;
    cv.height = rawImg.height;
    ctx.filter = 'none';
    ctx.drawImage(rawImg, 0, 0);
    document.getElementById('st').innerText = 'Showing Original Image';
}

function hideOriginal() {
    if(!loaded) return;
    render();
}

function autoFix() {
    document.getElementById('b').value = 105; 
    document.getElementById('c').value = 112; 
    document.getElementById('s').value = 115; 
    document.getElementById('sh').value = 35; 
    document.getElementById('up2').checked = true;
    render(); 
}

function resetAll() {
    document.getElementById('b').value = 100; 
    document.getElementById('c').value = 100; 
    document.getElementById('s').value = 100; 
    document.getElementById('sh').value = 0; 
    document.getElementById('up2').checked = false;
    render();
}
</script>
</body>
</html>
