<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Smart Unit & Measurement Converter Tool</title>
    <meta name="description" content="Free online unit conversion tool. Convert length, weight, and temperature units instantly with 100% client-side privacy.">
    <meta name="keywords" content="unit converter, measurement tool, kg to pounds, cm to inches, free online tools, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .result-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .result-box h4 { color: #38bdf8; margin-bottom: 5px; }
        .result-text { color: #34d399; font-size: 16px; font-weight: bold; line-height: 1.6; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>⚖️ گلوبال سمارٹ یونٹ کنورٹر</h2>
        <p>وزن، لمبائی اور درجہ حرارت کو فوری اور درست طریقے سے تبدیل کریں</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA STORED ON SERVER</span>
        </div>

        <div class="form-group">
            <label>تبدیلی کی قسم (Conversion Type):</label>
            <select id="convType" onchange="updateLabels()">
                <option value="weight">وزن (Kg ⟷ Pounds)</option>
                <option value="length">لمبائی (CM ⟷ Inches)</option>
                <option value="temp">درجہ حرارت (Celsius ⟷ Fahrenheit)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="inputLabel">رقم درج کریں (Value in KG):</label>
            <input type="number" id="inputValue" placeholder="مثال: 10">
        </div>

        <button class="btn-action" onclick="convertUnit()">🔄 تبدیل کریں</button>

        <div class="result-box">
            <h4>📈 تبدیل شدہ نتیجہ (Converted Result):</h4>
            <p id="convOutput" class="result-text">براہ کرم اوپر دی گئی معلومات درج کریں...</p>
        </div>
    </div>
</div>

<script>
    function updateLabels() {
        const type = document.getElementById('convType').value;
        const label = document.getElementById('inputLabel');
        if (type === 'weight') label.innerText = "وزن درج کریں (کلوگرام میں):";
        else if (type === 'length') label.innerText = "لمبائی درج کریں (سینٹی میٹر میں):";
        else if (type === 'temp') label.innerText = "درجہ حرارت درج کریں (سیلسیس میں):";
    }

    function convertUnit() {
        const type = document.getElementById('convType').value;
        const val = parseFloat(document.getElementById('inputValue').value);
        const output = document.getElementById('convOutput');

        if (isNaN(val)) {
            alert('براہ کرم درست عددی قیمت درج کریں!');
            return;
        }

        let resultText = "";
        if (type === 'weight') {
            let pounds = (val * 2.20462).toFixed(2);
            let grams = (val * 1000).toFixed(0);
            resultText = `${val} کلوگرام = ${pounds} پاؤنڈ (Pounds)<br>${val} کلوگرام = ${grams} گرام (Grams)`;
        } else if (type === 'length') {
            let inches = (val / 2.54).toFixed(2);
            let meters = (val / 100).toFixed(2);
            resultText = `${val} سینٹی میٹر = ${inches} انچ (Inches)<br>${val} سینٹی میٹر = ${meters} میٹر (Meters)`;
        } else if (type === 'temp') {
            let fahrenheit = ((val * 9/5) + 32).toFixed(1);
            resultText = `${val} °C = ${fahrenheit} °F (Fahrenheit)`;
        }

        output.innerHTML = resultText;
    }
</script>

</body>
</html>
