<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Hex, RGB & Color Picker Converter Tool</title>
    <meta name="description" content="Free online color picker and converter tool. Convert HEX to RGB, HSL, and pick colors instantly with 100% client-side privacy.">
    <meta name="keywords" content="color picker, hex to rgb converter, color code generator, web design tools, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .color-preview { width: 100%; height: 120px; border-radius: 12px; background-color: #38bdf8; margin-bottom: 20px; border: 1px solid #475569; transition: 0.2s; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        
        .input-row { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 50px; height: 42px; border-radius: 8px; cursor: pointer; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #475569; border-radius: 8px; }
        
        input[type="text"] { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; font-family: monospace; }
        
        .codes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; text-align: left; }
        .code-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .code-box span { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
        .code-box strong { font-size: 14px; color: #34d399; font-family: monospace; }

        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>🎨 Global Color Picker & Converter</h2>
        <p>Pick colors and convert HEX to RGB & HSL instantly for web development</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA STORED</span>
        </div>

        <div id="colorPreview" class="color-preview"></div>

        <div class="form-group">
            <label>Select or Type Color / رنگ منتخب کریں:</label>
            <div class="input-row">
                <input type="color" id="colorPicker" value="#38bdf8" oninput="updateFromPicker(this.value)">
                <input type="text" id="hexInput" value="#38bdf8" oninput="updateFromHex(this.value)" placeholder="#38bdf8">
            </div>
        </div>

        <div class="codes-grid">
            <div class="code-box">
                <span>HEX CODE</span>
                <strong id="resHex">#38bdf8</strong>
            </div>
            <div class="code-box">
                <span>RGB CODE</span>
                <strong id="resRgb">rgb(56, 189, 248)</strong>
            </div>
        </div>
    </div>
</div>

<script>
    function updateFromPicker(hex) {
        document.getElementById('hexInput').value = hex;
        updateValues(hex);
    }

    function updateFromHex(hex) {
        if (/^#[0-9A-F]{6}$/i.test(hex)) {
            document.getElementById('colorPicker').value = hex;
            updateValues(hex);
        }
    }

    function updateValues(hex) {
        const preview = document.getElementById('colorPreview');
        preview.style.backgroundColor = hex;
        
        document.getElementById('resHex').innerText = hex;

        // Convert HEX to RGB
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);

        document.getElementById('resRgb').innerText = `rgb(${r}, ${g}, ${b})`;
    }
</script>

</body>
</html>
