<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScan - Global Bulk WhatsApp & Message Sharing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8; }
        textarea { resize: vertical; height: 120px; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #16a34a, #15803d); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; display: inline-block; text-decoration: none; }
        .btn-action:hover { background: linear-gradient(135deg, #15803d, #166534); }
        
        .disclaimer-box { margin-top: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card" style="max-width: 600px; width: 100%;">
        <h2>📢 گلوبال بلک واٹس ایپ شیئرنگ ٹول</h2>
        <p>تنظیمی و انتخابی مہم کے لیے ووٹرز کو فوری پیغامات اور پرچیاں ارسال کریں</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">UNOFFICIAL - FOR PARTY / ORGANIZATIONAL USE ONLY - NOT ECP ISSUED</span>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>موبایل نمبر (مع کنٹری کوڈ، مثال: 923001234567):</label>
            <input type="text" id="phoneNumber" placeholder="923001234567">
        </div>

        <div class="form-group">
            <label>میسج ٹیمپلیٹ (Message Template):</label>
            <textarea id="msgTemplate">السلام علیکم! آپ کی انتخابی پرچی تیار ہے۔ 
حلقہ: NA-128
پولنگ بوتھ: نمبر 14
نوٹ: یہ پرچی صرف تنظیمی و سیاسی استعمال کے لیے ہے۔</textarea>
        </div>

        <!-- Consent Checkbox -->
        <div class="form-group" style="display:flex; gap:8px; align-items:center; background:#0f172a; padding:10px; border-radius:8px; border:1px solid #334155;">
            <input type="checkbox" id="consentCheck" style="width:18px; height:18px; cursor:pointer;">
            <label style="margin:0; font-size:12px; color:#cbd5e1; cursor:pointer;">میں تصدیق کرتا/کرتی ہوں کہ اس نمبر والے نے تنظیمی پیغامات وصول کرنے کی اجازت دی ہے۔</label>
        </div>

        <button class="btn-action" onclick="sendWhatsApp()">🚀 واٹس ایپ پر پیغام بھیجیں</button>
    </div>
</div>

<script>
    function sendWhatsApp() {
        if (!document.getElementById('consentCheck').checked) {
            alert('براہ کرم پہلے اجازت کی تصدیق کریں!');
            return;
        }

        let phone = document.getElementById('phoneNumber').value.trim();
        let message = document.getElementById('msgTemplate').value.trim();

        if (!phone) {
            alert('براہ کرم درست موبائل نمبر درج کریں!');
            return;
        }

        // Clean phone number (remove non-digits)
        phone = phone.replace(/[^0-9]/g, '');

        const encodedMessage = encodeURIComponent(message + "\n\n[UNOFFICIAL - FOR PARTY USE ONLY]");
        const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
        
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
