<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Global Reach -->
    <title>SmartScan - Global Age & Time Duration Calculator Tool</title>
    <meta name="description" content="Free online age calculator tool. Calculate exact age in years, months, days, hours, and minutes from your date of birth instantly. 100% client-side privacy.">
    <meta name="keywords" content="age calculator, date difference calculator, time duration tool, free online tools, smartscan portal">
    <meta name="author" content="SmartScan Portal">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        
        .result-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .result-box h4 { color: #38bdf8; margin-bottom: 5px; }
        .result-text { color: #34d399; font-size: 16px; font-weight: bold; line-height: 1.6; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #059669, #047857); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <h2>⏳ گلوبال عمر اور وقت کا کیلکولیٹر</h2>
        <p>اپنی درست عمر سالوں، مہینوں، دنوں اور گھنٹوں میں فوری معلوم کریں</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% CLIENT-SIDE PRIVACY - NO DATA STORED ON SERVER</span>
        </div>

        <div class="form-group">
            <label>تاریخِ پیدائش (Date of Birth):</label>
            <input type="date" id="birthDate">
        </div>

        <button class="btn-action" onclick="calculateAge()">📊 عمر کا حساب لگائیں</button>

        <div class="result-box">
            <h4>📈 آپ کی کل عمر (Exact Age Breakdown):</h4>
            <p id="ageOutput" class="result-text">براہ کرم اوپر اپنی تاریخِ پیدائش منتخب کریں...</p>
        </div>
    </div>
</div>

<script>
    function calculateAge() {
        const dobInput = document.getElementById('birthDate').value;
        const output = document.getElementById('ageOutput');

        if (!dobInput) {
            alert('براہ کرم اپنی تاریخِ پیدائش منتخب کریں!');
            return;
        }

        const dob = new Date(dobInput);
        const today = new Date();

        if (dob > today) {
            alert('تاریخِ پیدائش مستقبل کی نہیں ہو سکتی!');
            return;
        }

        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();

        if (days < 0) {
            months--;
            let prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        // Total approximate days
        const diffTime = Math.abs(today - dob);
        const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const totalHours = totalDays * 24;

        output.innerHTML = `${years} سال، ${months} مہینے، اور ${days} دن<br>
                            کل دن: ${totalDays.toLocaleString()} دن<br>
                            کل گھنٹے: ${totalHours.toLocaleString()} گھنٹے`;
    }
</script>

</body>
</html>
