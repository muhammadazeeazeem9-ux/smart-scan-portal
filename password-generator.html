<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Search Engine Ranking -->
    <title>SmartScan - Global Secure Password & PIN Generator Tool</title>
    <meta name="description" content="Free online secure password generator tool. Create strong, unhackable passwords and cryptographic PINs instantly on your browser. 100% client-side privacy.">
    <meta name="keywords" content="password generator, secure pin generator, free online tools, client side utility, smartscan portal">
    <meta name="author" content="SmartScan Portal">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        .card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .password-display { background: #0f172a; border: 2px dashed #38bdf8; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; color: #38bdf8; font-weight: bold; margin-bottom: 15px; word-break: break-all; letter-spacing: 2px; }
        
        .btn-action { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; }
        .btn-action:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        
        .btn-copy { background: linear-gradient(135deg, #16a34a, #15803d); margin-top: 8px; }
        .btn-copy:hover { background: linear-gradient(135deg, #15803d, #166534); }
        
        .disclaimer-box { margin-bottom: 15px; text-align: center; }
        .disclaimer-text { color: red; font-size: 10px; background: #fef2f2; padding: 6px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card" style="max-width: 600px; width: 100%;">
        <h2>🔐 گلوبال سکیور پاس ورڈ اور پن جنریٹر</h2>
        <p>مضبوط، محفوظ اور ہیکرز سے محفوظ پاس ورڈز براہ راست براؤزر میں بنائیں</p>

        <div class="disclaimer-box">
            <span class="disclaimer-text">100% SECURE CLIENT-SIDE TOOL - NO DATA STORED ON SERVER</span>
        </div>

        <div class="password-display" id="passOutput">P@ssw0rd-2026#Secure</div>

        <div class="form-group">
            <label>پاس ورڈ کی لمبائی (Length: 8 - 32):</label>
            <input type="number" id="passLength" value="16" min="8" max="32">
        </div>

        <div class="form-group">
            <label>قسم منتخب کریں (Type):</label>
            <select id="passType">
                <option value="complex">الفاظ، اعداد اور علامات (Full Complex)</option>
                <option value="alphaNumeric">صرف حروف اور اعداد (Alpha-Numeric)</option>
                <option value="pin">صرف ہندسوں کا پن (Numeric PIN Only)</option>
            </select>
        </div>

        <button class="btn-action" onclick="generatePassword()">✨ نیا پاس ورڈ بنائیں</button>
        <button class="btn-action btn-copy" onclick="copyPassword()">📋 پاس ورڈ کاپی کریں</button>
    </div>
</div>

<script>
    function generatePassword() {
        let length = parseInt(document.getElementById('passLength').value) || 16;
        let type = document.getElementById('passType').value;
        
        let chars = "";
        if (type === 'complex') {
            chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
        } else if (type === 'alphaNumeric') {
            chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        } else if (type === 'pin') {
            chars = "0123456789";
        }

        let password = "";
        for (let i = 0; i < length; i++) {
            let randomIndex = Math.floor(Math.random() * chars.length);
            password += chars[randomIndex];
        }

        document.getElementById('passOutput').innerText = password;
    }

    function copyPassword() {
        let passText = document.getElementById('passOutput').innerText;
        navigator.clipboard.writeText(passText).then(() => {
            alert('پاس ورڈ کامیابی سے کلپ بورڈ پر کاپی ہو گیا!');
        });
    }

    window.onload = function() {
        generatePassword();
    };
</script>

</body>
</html>
