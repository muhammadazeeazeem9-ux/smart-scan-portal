<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScan - Global Voter Slip & QR Generator</title>
    <!-- QRCode.js for QR Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html2canvas for Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 1100px; justify-content: center; }
        
        /* Form Card */
        .form-card { background: #1e293b; border-radius: 16px; padding: 25px; border: 1px solid #334155; flex: 1; min-width: 320px; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .form-card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .form-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn-generate { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-generate:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }

        /* Preview Slip Card */
        .preview-wrapper { flex: 1; min-width: 320px; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .slip-card { background: #ffffff; color: #0f172a; border-radius: 16px; padding: 25px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 4px solid #0284c7; text-align: right; position: relative; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 15px; margin-bottom: 15px; }
        .slip-header h3 { font-size: 20px; color: #0284c7; }
        .slip-header p { font-size: 12px; color: #64748b; }
        .slip-row { margin-bottom: 10px; font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .slip-row span:first-child { font-weight: bold; color: #475569; }
        .slip-row span:last-child { color: #0f172a; font-weight: 600; }
        
        .qr-box { display: flex; justify-content: center; margin-top: 15px; padding-top: 15px; border-top: 2px dashed #cbd5e1; }
        
        .btn-action-group { width: 100%; display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-download { background: #16a34a; }
        .btn-download:hover { background: #15803d; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Form Inputs -->
    <div class="form-card">
        <h2>🗳️ گلوبال ووٹر پرچی جنریٹر</h2>
        <p>بین الاقوامی سطح پر ڈیجیٹل ووٹر پرچی اور QR کوڈ بنائیں</p>

        <div class="form-group">
            <label>ملک منتخب کریں (Select Country):</label>
            <select id="voterCountry">
                <option value="Pakistan">پاکستان (Pakistan)</option>
                <option value="USA">ریاستہائے متحدہ امریکہ (USA)</option>
                <option value="UK">برطانیہ (United Kingdom)</option>
                <option value="Canada">کینیڈا (Canada)</option>
                <option value="UAE">متحدہ عرب امارات (UAE)</option>
                <option value="Global">🌐 دیگر بین الاقوامی ممالک (Global)</option>
            </select>
        </div>

        <div class="form-group">
            <label>ووটার کا نام (Voter Name):</label>
            <input type="text" id="voterName" placeholder="مثال: محمد احمد / John Doe">
        </div>

        <div class="form-group">
            <label>حلقہ / ڈسٹرکٹ (Constituency / District):</label>
            <input type="text" id="voterConstituency" placeholder="مثال: NA-128 لاہور / District 5">
        </div>

        <div class="form-group">
            <label>بوتھ یا اسٹریٹ نمبر (Booth / Block No):</label>
            <input type="text" id="voterBooth" placeholder="مثال: بوتھ نمبر 14 / Block B">
        </div>

        <div class="form-group">
            <label>حوالہ / آخری 4 ہندسے (Ref / Last 4 Digits Only):</label>
            <input type="text" id="voterIdCode" placeholder="مثال: XXXX-XXX-1234">
        </div>

        <button class="btn-generate" onclick="generateVoterSlip()">✨ ڈیجیٹل پرچی اور QR بنائیں</button>
    </div>

    <!-- Live Preview Slip -->
    <div class="preview-wrapper">
        <div class="slip-card" id="slipToPrint">
            <div class="slip-header">
                <div>
                    <h3 id="previewVoterName">محمد احمد</h3>
                    <p>SmartScan Official Voter Slip</p>
                </div>
                <div style="font-size: 11px; font-weight: bold; color: #0284c7; background: #e0f2fe; padding: 5px 10px; border-radius: 6px;" id="previewCountry">Pakistan</div>
            </div>

            <div class="slip-row">
                <span>حلقہ / علاقہ:</span>
                <span id="previewConstituency">NA-128 لاہور</span>
            </div>
            <div class="slip-row">
                <span>پولنگ بوتھ:</span>
                <span id="previewBooth">بوتھ نمبر 14</span>
            </div>
            <div class="slip-row">
                <span>حوالہ (آخری 4 ہندسے):</span>
                <span id="previewIdCode">1234</span>
            </div>

            <!-- Official Disclaimer Line -->
            <div style="margin-top: 15px; text-align: center;">
                <p style="color: red; font-size: 10px; background: #fef2f2; padding: 4px; border-radius: 4px; border: 1px solid #fecaca; display: inline-block; font-weight: bold;">UNOFFICIAL - FOR PARTY / ORGANIZATIONAL USE ONLY - NOT ECP ISSUED</p>
            </div>

            <div class="qr-box" id="qrcode"></div>
        </div>

        <div class="btn-action-group">
            <button class="btn-action btn-download" onclick="downloadSlip()">📥 پرچی بطور امیج ڈاؤن لوڈ کریں</button>
        </div>
    </div>
</div>

<script>
    function generateVoterSlip() {
        const name = document.getElementById('voterName').value.trim() || 'محمد احمد';
        const country = document.getElementById('voterCountry').value;
        const constituency = document.getElementById('voterConstituency').value.trim() || 'NA-128 لاہور';
        const booth = document.getElementById('voterBooth').value.trim() || 'بوتھ نمبر 14';
        const idCode = document.getElementById('voterIdCode').value.trim() || '1234';

        // Extract last 4 digits securely
        const last4 = idCode.replace(/[^0-9]/g, '').slice(-4) || '1234';

        // Update UI Preview
        document.getElementById('previewVoterName').innerText = name;
        document.getElementById('previewCountry').innerText = country;
        document.getElementById('previewConstituency').innerText = constituency;
        document.getElementById('previewBooth').innerText = booth;
        document.getElementById('previewIdCode').innerText = last4;

        // Generate QR Code with secure logic
        document.getElementById('qrcode').innerHTML = "";
        const qrData = `UNOFFICIAL SLIP | Name: ${name} | Country: ${country} | Booth: ${booth} | Ref Last4: ${last4}`;
        
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 100,
            height: 100,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function downloadSlip() {
        const slip = document.getElementById('slipToPrint');
        if (typeof html2canvas !== 'undefined') {
            html2canvas(slip, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'SmartScan_Voter_Slip.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    }

    window.onload = function() {
        generateVoterSlip();
    };
</script>

</body>
</html>
