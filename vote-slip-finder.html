<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ووٹ پرچی فائنڈر - SmartScan</title>
    <!-- Supabase v2.45.4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { margin-bottom: 20px; color: #1e293b; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; outline: none; direction: ltr; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; margin-top: 10px; display: none; font-size: 14px; }
        .result-box { margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: right; background-color: #f8fafc; display: none; }
        .info-row { margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; padding-bottom: 5px; }
        .info-label { font-weight: bold; color: #475569; }
        .info-value { color: #0f172a; }
        .map-btn { display: inline-block; width: 100%; padding: 10px; margin-top: 10px; background-color: #16a34a; color: white; text-decoration: none; border-radius: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📦 ووٹ پرچی فائنڈر</h2>
        <div class="input-group">
            <input type="text" id="cnicInput" placeholder="3660114730363" maxlength="15">
            <button onclick="searchVoter()">تلاش کریں</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="voterCard" class="result-box">
            <div class="info-row"><span class="info-label">ووٹر کا نام:</span><span id="voterName" class="info-value"></span></div>
            <div class="info-row"><span class="info-label">والد کا نام:</span><span id="fatherName" class="info-value"></span></div>
            <div class="info-row"><span class="info-label">سلسلہ نمبر:</span><span id="serialNo" class="info-value"></span></div>
            <div class="info-row"><span class="info-label">پولنگ اسٹیشن:</span><span id="pollingStation" class="info-value"></span></div>
            <a id="mapLink" class="map-btn" target="_blank" href="#">📍 پولنگ اسٹیشن کا نقشہ اور راستہ دیکھیں</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ozhmuznwykhizyvxhjvk.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_vby7dhYJrml-z_52C-7v1A_IQkHUyTY"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function searchVoter() {
            const cnic = document.getElementById('cnicInput').value.trim().replace(/-/g, '');
            const errorMsg = document.getElementById('errorMsg');
            const voterCard = document.getElementById('voterCard');
            errorMsg.style.display = 'none';
            voterCard.style.display = 'none';

            if (!cnic) { 
                alert('براہ کرم شناختی کارڈ نمبر درج کریں۔'); 
                return; 
            }

            try {
                const { data, error } = await supabaseClient.rpc('search_voter_by_cnic', { search_cnic: cnic });
                console.log("API Response:", data, error);

                if (error) {
                    errorMsg.innerText = "خرابی: " + error.message;
                    errorMsg.style.display = 'block';
                    return;
                }
                if (data && data.length > 0) {
                    const voter = data[0];
                    document.getElementById('voterName').innerText = voter.name || 'N/A';
                    document.getElementById('fatherName').innerText = voter.father_name || 'N/A';
                    document.getElementById('serialNo').innerText = voter.serial_no || 'N/A';
                    document.getElementById('pollingStation').innerText = voter.polling_station || 'N/A';
                    document.getElementById('mapLink').href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(voter.polling_station || '');
                    voterCard.style.display = 'block';
                } else {
                    errorMsg.innerText = "کوئی بھی ریکارڈ نہیں ملا۔ براہ کرم درست شناختی کارڈ نمبر درج کریں۔";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = "کوئی غیر متوقع خرابی پیش آئی ہے۔";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
